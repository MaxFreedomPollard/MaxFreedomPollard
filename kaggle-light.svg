  <!-- Cell 3: Google Quantum AI live ranking -->
  <text x="671" y="29.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.6" xml:space="preserve"><tspan fill="#475569">Google Quantum AI: </tspan><tspan fill="#0F172A" font-weight="600">#386</tspan><tspan fill="#64748B" font-size="11.5">&#160;(/3,304)</tspan></text>

