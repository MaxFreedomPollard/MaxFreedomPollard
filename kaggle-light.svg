    </radialGradient>
    <linearGradient id="border" x1="450" y1="3" x2="450" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="1" y="3" width="898" height="44" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="1" y="3" width="898" height="44" rx="10" fill="url(#bg)"/>
    <rect x="1" y="3" width="898" height="44" fill="url(#glow)"/>
  </g>
  <rect x="1" y="3" width="898" height="44" rx="10" stroke="url(#border)" stroke-width="1"/>
  <line x1="246" y1="13" x2="246" y2="37" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="534" y1="13" x2="534" y2="37" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="808" y1="13" x2="808" y2="37" stroke="#CBD5E1" stroke-width="1"/>
  <!-- Left label: Kaggle mark + Competitions entered -->
  <rect x="16" y="16" width="18" height="18" rx="4.5" fill="#0284C7" fill-opacity="0.16"/>
  <text x="25" y="29" text-anchor="middle" fill="#0284C7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800">K</text>
  <text x="41" y="29" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.3" xml:space="preserve"><tspan fill="#1E293B" font-weight="700" letter-spacing="0.35">KAGGLE</tspan><tspan fill="#64748B">&#160;·&#160;</tspan><tspan fill="#475569" font-weight="500">Competitions: </tspan><tspan fill="#0F172A" font-weight="600">2</tspan></text>

