<svg xmlns="http://www.w3.org/2000/svg" width="900" height="50" viewBox="0 0 900 50" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="3" x2="900" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <radialGradient id="glow" cx="120" cy="25" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.06"/>
