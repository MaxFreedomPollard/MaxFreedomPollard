<svg xmlns="http://www.w3.org/2000/svg" width="900" height="112" viewBox="0 0 900 112" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="320" cy="0" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="580" cy="0" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cardBorder" x1="450" y1="0" x2="450" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="topBeam" x1="160" y1="1" x2="740" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#0284C7" stop-opacity="0.80"/>
      <stop offset="55%" stop-color="#4F46E5" stop-opacity="0.80"/>
      <stop offset="78%" stop-color="#059669" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="titleFill" x1="450" y1="40" x2="450" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.95" fill="#64748B" fill-opacity="0.15"/>
    </pattern>

    <radialGradient id="dotFade" cx="450" cy="56" r="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="45%" stop-color="#4D4D4D"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </radialGradient>

    <mask id="dotMask">
      <rect width="900" height="112" fill="url(#dotFade)"/>
    </mask>

    <clipPath id="cardClip">
      <rect x="1" y="1" width="898" height="110" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="1" y="1" width="898" height="110" rx="16" fill="url(#bg)"/>
    <rect x="1" y="1" width="898" height="110" fill="url(#glowLeft)"/>
    <rect x="1" y="1" width="898" height="110" fill="url(#glowRight)"/>
    <rect x="1" y="1" width="898" height="110" fill="url(#dots)" mask="url(#dotMask)"/>
  </g>

  <rect x="1" y="1" width="898" height="110" rx="16" stroke="url(#cardBorder)" stroke-width="1"/>
  <line x1="160" y1="1" x2="740" y2="1" stroke="url(#topBeam)" stroke-width="1.5"/>

  <!-- Display Name -->
  <text x="450" y="69" text-anchor="middle" fill="url(#titleFill)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.75">Max Freedom Pollard</text>
</svg>
