name: Update Kaggle Live Stripe

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/svg_stripes.py"
      - "scripts/update_kaggle_live.py"
      - ".github/workflows/update-kaggle-live.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data-branch
  cancel-in-progress: false

jobs:
  update-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Prepare live-data worktree
        run: |
          git fetch origin live-data:refs/remotes/origin/live-data 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/live-data; then
            git worktree add -B live-data /tmp/live-data refs/remotes/origin/live-data
          else
            git worktree add --detach /tmp/live-data
            git -C /tmp/live-data checkout --orphan live-data
            git -C /tmp/live-data rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Generate Kaggle live ranking SVG stripes
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USER: ${{ vars.KAGGLE_USER }}
          KAGGLE_TEAM_NAMES: ${{ vars.KAGGLE_TEAM_NAMES }}
        run: python3 scripts/update_kaggle_live.py --output-dir /tmp/live-data

      - name: Commit and push live-data if rankings changed
        run: |
          cd /tmp/live-data
          git add kaggle*.svg kaggle.json
          if git diff --cached --quiet; then
            echo "Kaggle rankings unchanged; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(live-data): refresh Kaggle live rankings"
          git push origin HEAD:live-data
