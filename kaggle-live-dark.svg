<svg xmlns="http://www.w3.org/2000/svg" width="90" height="50" viewBox="810 0 90 50" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="3" x2="900" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <radialGradient id="glow" cx="120" cy="25" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#20BEFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#20BEFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="border" x1="450" y1="3" x2="450" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="btnBg" x1="0" y1="9.5" x2="0" y2="40.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#162338"/>
      <stop offset="100%" stop-color="#101A2C"/>
    </linearGradient>
    <linearGradient id="btnBorder" x1="0" y1="9.5" x2="0" y2="40.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.85"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="1" y="3" width="898" height="44" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="1" y="3" width="898" height="44" rx="10" fill="url(#bg)"/>
    <rect x="1" y="3" width="898" height="44" fill="url(#glow)"/>
  </g>
  <rect x="1" y="3" width="898" height="44" rx="10" stroke="url(#border)" stroke-width="1"/>
  <line x1="242" y1="13" x2="242" y2="37" stroke="#1E293B" stroke-width="1"/>
  <line x1="809" y1="13" x2="809" y2="37" stroke="#1E293B" stroke-width="1"/>
  <!-- Left label: Kaggle mark + Competitions entered -->
  <rect x="16" y="16" width="18" height="18" rx="4.5" fill="#20BEFF" fill-opacity="0.16"/>
  <text x="25" y="29" text-anchor="middle" fill="#20BEFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800">K</text>
  <text x="41" y="29" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.3" xml:space="preserve"><tspan fill="#E2E8F0" font-weight="700" letter-spacing="0.35">KAGGLE</tspan><tspan fill="#64748B">&#160;·&#160;</tspan><tspan fill="#94A3B8" font-weight="500">Competitions: </tspan><tspan fill="#F8FAFC" font-weight="600">2</tspan></text>

  <!-- Button 1: IEEE Big Data public leaderboard -->
  <rect x="249" y="9.5" width="276" height="31" rx="7.5" fill="url(#btnBg)" stroke="url(#btnBorder)" stroke-width="1"/>
  <text x="379" y="29.2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.9" xml:space="preserve"><tspan fill="#94A3B8" font-weight="500">IEEE: </tspan><tspan fill="#F8FAFC" font-weight="600">#1 pub · #23 priv</tspan><tspan fill="#64748B" font-size="10.9">&#160;(/802)</tspan></text>
  <path d="M507.5 28.2L514 21.7M509.3 21.7H514V26.4" stroke="#38BDF8" stroke-opacity="0.85" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Button 2: Google Quantum AI public leaderboard -->
  <rect x="535" y="9.5" width="269" height="31" rx="7.5" fill="url(#btnBg)" stroke="url(#btnBorder)" stroke-width="1"/>
  <text x="661.5" y="29.2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.9" xml:space="preserve"><tspan fill="#94A3B8" font-weight="500">Google Quantum AI: </tspan><tspan fill="#F8FAFC" font-weight="600">#421</tspan><tspan fill="#64748B" font-size="10.9">&#160;(/3,417)</tspan></text>
  <path d="M786.5 28.2L793 21.7M788.3 21.7H793V26.4" stroke="#38BDF8" stroke-opacity="0.85" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right cell: 15m live indicator -->
  <circle cx="826" cy="25" r="3" fill="#20BEFF"/>
  <text x="835" y="29" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500">15m live</text>
</svg>
