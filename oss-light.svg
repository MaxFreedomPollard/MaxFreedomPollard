<svg xmlns="http://www.w3.org/2000/svg" width="900" height="50" viewBox="0 0 900 50" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="3" x2="900" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <radialGradient id="glow" cx="120" cy="25" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="border" x1="450" y1="3" x2="450" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="1" y="3" width="898" height="44" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="1" y="3" width="898" height="44" rx="10" fill="url(#bg)"/>
    <rect x="1" y="3" width="898" height="44" fill="url(#glow)"/>
  </g>
  <rect x="1" y="3" width="898" height="44" rx="10" stroke="url(#border)" stroke-width="1"/>
  <line x1="246" y1="13" x2="246" y2="37" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="438" y1="13" x2="438" y2="37" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="642" y1="13" x2="642" y2="37" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="808" y1="13" x2="808" y2="37" stroke="#CBD5E1" stroke-width="1"/>
  <!-- Left label: Git PR/merge badge + REPOS CONTRIBUTED TO -->
  <rect x="16" y="16" width="18" height="18" rx="4.5" fill="#4F46E5" fill-opacity="0.16"/>
  <g transform="translate(19, 19)" stroke="#4F46E5" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="3" cy="3" r="1.7"/>
    <circle cx="3" cy="9.5" r="1.7"/>
    <circle cx="9.2" cy="9.5" r="1.7"/>
    <path d="M3 4.7V7.8"/>
    <path d="M4.7 3C7.3 3 9.2 4.8 9.2 7.8"/>
  </g>
  <text x="41" y="29" fill="#1E293B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.3" font-weight="700" letter-spacing="0.35">REPOS CONTRIBUTED TO</text>

  <!-- Cell 2: repo count & merged count -->
  <text x="342" y="29.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" xml:space="preserve"><tspan fill="#0F172A" font-weight="600">145</tspan><tspan fill="#475569"> repos</tspan><tspan fill="#64748B">&#160;&#160;·&#160;&#160;</tspan><tspan fill="#0F172A" font-weight="600">311</tspan><tspan fill="#475569"> merged</tspan></text>

  <!-- Cell 3: Combined stars -->
  <g transform="translate(478, 18)" fill="#D97706">
    <path d="M6.5 0.8L8.25 4.35L12.17 4.92L9.33 7.68L10.0 11.58L6.5 9.74L3.0 11.58L3.67 7.68L0.83 4.92L4.75 4.35L6.5 0.8Z"/>
  </g>
  <text x="496" y="29.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" xml:space="preserve"><tspan fill="#0F172A" font-weight="600">1,478,012</tspan><tspan fill="#475569"> stars</tspan></text>

  <!-- Cell 4: Combined forks -->
  <g transform="translate(668, 17.5)" stroke="#0284C7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="3.5" cy="3" r="1.9"/>
    <circle cx="10.5" cy="3" r="1.9"/>
    <circle cx="7" cy="12" r="1.9"/>
    <path d="M3.5 4.9V6.2C3.5 7.6 4.6 8.5 7 8.5C9.4 8.5 10.5 7.6 10.5 6.2V4.9"/>
    <path d="M7 8.5V10.1"/>
  </g>
  <text x="687" y="29.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" xml:space="preserve"><tspan fill="#0F172A" font-weight="600">203,480</tspan><tspan fill="#475569"> forks</tspan></text>

  <!-- Cell 5: Live cadence indicator -->
  <circle cx="826" cy="25" r="3" fill="#059669"/>
  <text x="835" y="29" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500">24h sync</text>
</svg>
